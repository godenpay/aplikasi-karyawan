<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Absensi — Check In / Check Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F5F1;
    --card: #FFFFFF;
    --ink: #1C2321;
    --ink-soft: #5B6360;
    --line: #E4E1D8;
    --teal: #0F6959;
    --teal-soft: #E4F1EE;
    --amber: #B4700A;
    --amber-soft: #FBF0DE;
    --red: #B23A34;
    --red-soft: #FBE9E7;
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 0%, #EEEBDF 0%, transparent 45%);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding: 24px 16px 60px;
  }
  .app{ width:100%; max-width:420px; }
  h1,h2{ font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em; }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:16px;
    box-shadow: 0 1px 2px rgba(28,35,33,0.04);
  }
  /* ---- Login ---- */
  #loginView h1{ font-size:26px; margin-bottom:4px; }
  #loginView p{ color:var(--ink-soft); font-size:14px; margin:0 0 24px; }
  label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink); }
  input{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    font-size:16px;
    font-family:'JetBrains Mono',monospace;
    margin-bottom:16px;
    background:#FBFAF7;
  }
  input:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  button{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active{ transform: scale(0.98); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-teal{ background:var(--teal); color:#fff; }
  .btn-outline{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .error-msg{ background:var(--red-soft); color:var(--red); padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:16px; display:none; }

  /* ---- Main ---- */
  #mainView{ display:none; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .who{ font-size:14px; color:var(--ink-soft); }
  .who b{ color:var(--ink); }
  .logout{ font-size:12px; color:var(--ink-soft); background:none; border:none; width:auto; padding:4px; text-decoration:underline; }

  .clock-card{ text-align:center; padding:28px 20px; }
  .clock{
    font-family:'JetBrains Mono',monospace;
    font-size:44px;
    font-weight:600;
    letter-spacing:0.02em;
    line-height:1;
  }
  .date-label{ font-size:13px; color:var(--ink-soft); margin-top:8px; }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px;
    margin-top:14px;
  }
  .pill-neutral{ background:#EFEDE5; color:var(--ink-soft); }
  .pill-ontime{ background:var(--teal-soft); color:var(--teal); }
  .pill-late{ background:var(--amber-soft); color:var(--amber); }

  .cam-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 4/3;
    background:#111;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:16px;
  }
  video, canvas, .cam-preview{ width:100%; height:100%; object-fit:cover; display:block; }
  canvas{ display:none; }
  .cam-hint{
    position:absolute; bottom:10px; left:0; right:0; text-align:center;
    font-size:11px; color:#fff; opacity:0.85; font-family:'JetBrains Mono',monospace;
  }
  .gps-row{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--ink-soft); margin-bottom:16px;
    font-family:'JetBrains Mono',monospace;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-soft); flex-shrink:0; }
  .dot.ok{ background:var(--teal); }
  .dot.pending{ background:var(--amber); animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .history-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .history-item:last-child{ border-bottom:none; }
  .history-date{ font-family:'JetBrains Mono',monospace; color:var(--ink-soft); }
  .history-times{ text-align:right; }
  .badge{ font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; margin-left:6px;}
  .badge-ontime{ background:var(--teal-soft); color:var(--teal); }
  .badge-late{ background:var(--amber-soft); color:var(--amber); }

  .empty{ color:var(--ink-soft); font-size:13px; text-align:center; padding:12px 0; }
</style>
</head>
<body>
<div class="app">

  <!-- LOGIN -->
  <div id="loginView" class="card">
    <p class="eyebrow">Absensi Karyawan</p>
    <h1>Selamat datang</h1>
    <p>Masuk pakai ID karyawan dan PIN kamu.</p>
    <div id="loginError" class="error-msg"></div>
    <label for="empId">ID Karyawan</label>
    <input id="empId" type="text" inputmode="text" placeholder="EMP001" autocomplete="off" />
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="••••" autocomplete="off" />
    <button class="btn-primary" onclick="doLogin()" id="loginBtn">Masuk</button>
  </div>

  <!-- MAIN -->
  <div id="mainView">
    <div class="topbar">
      <div class="who">Halo, <b id="empName">—</b></div>
      <button class="logout" onclick="logout()">Keluar</button>
    </div>

    <div class="card clock-card">
      <div class="clock" id="clock">00:00:00</div>
      <div class="date-label" id="dateLabel">—</div>
      <div id="statusPill" class="status-pill pill-neutral">Belum check-in</div>
    </div>

    <div class="card">
      <p class="eyebrow" id="camLabel">Ambil selfie untuk check-in</p>
      <div class="cam-wrap">
        <video id="video" autoplay playsinline muted></video>
        <img id="camPreview" class="cam-preview" style="display:none" />
        <canvas id="canvas"></canvas>
        <div class="cam-hint" id="camHint">Mengaktifkan kamera…</div>
      </div>
      <div class="gps-row">
        <div class="dot pending" id="gpsDot"></div>
        <span id="gpsLabel">Mencari lokasi GPS…</span>
      </div>
      <div id="actionError" class="error-msg"></div>
      <button class="btn-teal" id="actionBtn" onclick="handleAction()" disabled>Ambil Foto & Check In</button>
    </div>

    <div class="card">
      <p class="eyebrow">Riwayat 14 Hari Terakhir</p>
      <div id="historyList"><div class="empty">Memuat riwayat…</div></div>
    </div>
  </div>

</div>

<script>
// ====== KONFIGURASI — GANTI DENGAN URL WEB APP GAS KAMU ======
const API_URL = "PASTE_URL_WEB_APP_GAS_DI_SINI";

let token = localStorage.getItem('absensi_token') || null;
let stream = null;
let capturedPhoto = null;
let currentPosition = null;
let currentStatus = { checked_in: false, checked_out: false };

function $(id){ return document.getElementById(id); }

// ---- API helper (pakai text/plain agar tidak kena CORS preflight) ----
async function api(payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

// ---- Login ----
async function doLogin(){
  const employee_id = $('empId').value.trim();
  const pin = $('pin').value.trim();
  $('loginError').style.display = 'none';
  if(!employee_id || !pin){
    showError('loginError', 'Isi ID karyawan dan PIN.');
    return;
  }
  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'Memproses…';
  try{
    const res = await api({ action:'login', employee_id, pin });
    if(!res.ok){ showError('loginError', res.error); return; }
    token = res.token;
    localStorage.setItem('absensi_token', token);
    localStorage.setItem('absensi_name', res.name);
    enterMainView();
  }catch(e){
    showError('loginError', 'Gagal terhubung ke server.');
  }finally{
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = 'Masuk';
  }
}

function logout(){
  localStorage.removeItem('absensi_token');
  token = null;
  stopCamera();
  $('mainView').style.display = 'none';
  $('loginView').style.display = 'block';
}

function showError(id, msg){
  const el = $(id);
  el.textContent = msg;
  el.style.display = 'block';
}

// ---- Main view ----
async function enterMainView(){
  $('loginView').style.display = 'none';
  $('mainView').style.display = 'block';
  $('empName').textContent = localStorage.getItem('absensi_name') || '—';
  startClock();
  await refreshStatus();
  await loadHistory();
  startCamera();
  startGPS();
}

function startClock(){
  function tick(){
    const now = new Date();
    $('clock').textContent = now.toLocaleTimeString('id-ID', { hour12:false });
    $('dateLabel').textContent = now.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  }
  tick();
  setInterval(tick, 1000);
}

async function refreshStatus(){
  const res = await api({ action:'status', token });
  if(!res.ok){ if(res.error && res.error.includes('Sesi')) logout(); return; }
  currentStatus = res;
  updateStatusUI();
}

function updateStatusUI(){
  const pill = $('statusPill');
  const camLabel = $('camLabel');
  const actionBtn = $('actionBtn');

  if(!currentStatus.checked_in){
    pill.className = 'status-pill pill-neutral';
    pill.textContent = 'Belum check-in';
    camLabel.textContent = 'Ambil selfie untuk check-in';
    actionBtn.textContent = 'Ambil Foto & Check In';
    actionBtn.dataset.mode = 'checkin';
  } else if(!currentStatus.checked_out){
    pill.className = currentStatus.status === 'Terlambat' ? 'status-pill pill-late' : 'status-pill pill-ontime';
    pill.textContent = 'Check-in ' + currentStatus.check_in_time + (currentStatus.status === 'Terlambat' ? ' · Terlambat' : ' · Tepat waktu');
    camLabel.textContent = 'Ambil selfie untuk check-out';
    actionBtn.textContent = 'Ambil Foto & Check Out';
    actionBtn.dataset.mode = 'checkout';
  } else {
    pill.className = 'status-pill pill-ontime';
    pill.textContent = 'Selesai · Masuk ' + currentStatus.check_in_time + ' — Pulang ' + currentStatus.check_out_time;
    camLabel.textContent = 'Absensi hari ini sudah lengkap';
    actionBtn.textContent = 'Absensi Hari Ini Selesai';
    actionBtn.disabled = true;
    stopCamera();
  }
}

// ---- Camera ----
async function startCamera(){
  if(currentStatus.checked_in && currentStatus.checked_out) return;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
    $('video').srcObject = stream;
    $('camHint').textContent = 'Posisikan wajah di tengah frame';
    checkReady();
  }catch(e){
    $('camHint').textContent = 'Kamera tidak dapat diakses — izinkan akses kamera di browser.';
  }
}
function stopCamera(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}
function capturePhoto(){
  const video = $('video');
  const canvas = $('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  capturedPhoto = canvas.toDataURL('image/jpeg', 0.7);
}

// ---- GPS ----
function startGPS(){
  if(!navigator.geolocation){
    $('gpsLabel').textContent = 'Browser tidak mendukung GPS.';
    return;
  }
  navigator.geolocation.watchPosition(
    (pos) => {
      currentPosition = pos.coords;
      $('gpsDot').className = 'dot ok';
      $('gpsLabel').textContent = 'Lokasi ditemukan (akurasi ~' + Math.round(pos.coords.accuracy) + ' m)';
      checkReady();
    },
    (err) => {
      $('gpsDot').className = 'dot';
      $('gpsLabel').textContent = 'GPS gagal: ' + err.message;
    },
    { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
  );
}

function checkReady(){
  const ready = !!stream && !!currentPosition && !(currentStatus.checked_in && currentStatus.checked_out);
  $('actionBtn').disabled = !ready;
}

// ---- Check-in / Check-out ----
async function handleAction(){
  const mode = $('actionBtn').dataset.mode;
  $('actionError').style.display = 'none';
  capturePhoto();

  $('actionBtn').disabled = true;
  $('actionBtn').textContent = 'Mengirim…';

  try{
    const res = await api({
      action: mode,
      token,
      lat: currentPosition.latitude,
      lng: currentPosition.longitude,
      accuracy: currentPosition.accuracy,
      photo: capturedPhoto
    });
    if(!res.ok){
      showError('actionError', res.error);
      $('actionBtn').disabled = false;
      updateStatusUI();
      return;
    }
    await refreshStatus();
    await loadHistory();
  }catch(e){
    showError('actionError', 'Gagal mengirim data. Cek koneksi internet.');
    $('actionBtn').disabled = false;
  }
}

// ---- History ----
async function loadHistory(){
  const res = await api({ action:'history', token, limit:14 });
  const list = $('historyList');
  if(!res.ok || !res.records || res.records.length === 0){
    list.innerHTML = '<div class="empty">Belum ada riwayat absensi.</div>';
    return;
  }
  list.innerHTML = res.records.map(r => `
    <div class="history-item">
      <span class="history-date">${r.date}</span>
      <span class="history-times">
        ${r.check_in_time || '—'} → ${r.check_out_time || '—'}
        ${r.status ? `<span class="badge ${r.status === 'Terlambat' ? 'badge-late' : 'badge-ontime'}">${r.status}</span>` : ''}
      </span>
    </div>
  `).join('');
}

// ---- Init ----
if(token){ enterMainView(); }
</script>
</body>
</html>
